name: OCI ARM Grabber

on:
  workflow_dispatch:
  schedule:
    - cron: '*/2 * * * *'

jobs:
  grab-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install Dependencies
        run: composer install

      - name: Create Key File
        run: echo "${{ secrets.OCI_PRIVATE_KEY }}" > private_key.pem

      - name: Run Script
        env:
          # Critical: These names must match the script's internal logic
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_IMAGE_ID: 'ocid1.image.oc1.ap-hyderabad-1.aaaaaaaaca7s2s5pgnooszcjysi7pknrimayqjds6knvjascphe2r767m6vq'
          OCI_PRIVATE_KEY_FILENAME: './private_key.pem'
          
          # Adding the missing Shape and Resource variables
          OCI_SHAPE: 'VM.Standard.A1.Flex'
          OCI_OCPUS: 4
          OCI_MEMORY_IN_GBS: 24
          OCI_AVAILABILITY_DOMAIN: 'Vgss:AP-HYDERABAD-1-AD-1'
        run: php index.php